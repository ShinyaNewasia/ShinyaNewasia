<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片墙 · 小窝</title>
<meta name="description" content="小窝的照片墙：按相册收好的图片，点开能放大看。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C3AED'/><path d='M8 16.5 16 10l8 6.5V24a1 1 0 0 1-1 1h-4.5v-5h-5v5H9a1 1 0 0 1-1-1z' fill='%23fff'/></svg>">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/kit.css">
<script>
  try {
    var saved = localStorage.getItem("hut-theme");
    if (saved === "night") document.documentElement.setAttribute("data-theme", "night");
    else if (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.setAttribute("data-theme", "night");
  } catch (e) {}
</script>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html">小窝<b>.</b></a>
    <nav>
      <a href="index.html">首页</a>
      <a href="posts.html">文章</a>
      <a href="photos.html" aria-current="page">照片</a>
      <a href="links.html">收藏</a>
      <a href="about.html">关于</a>
      <a href="admin.html">我的</a>
      <button class="theme-btn" id="theme-toggle" type="button" aria-label="切换夜间模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap" id="photo-wall">

  <section class="intro tight">
    <p class="eyebrow">GALLERY · 照片墙</p>
    <h1>拍下来的，和存下来的。</h1>
    <p class="lede">按相册分。点一本进去看，图片点一下能放大，按 Esc 关掉。</p>
  </section>

  <section class="album-view" id="album-index">
    <h2 class="block-title"><span>相册</span><a href="admin.html">去后台加</a></h2>
    <div class="album-grid" id="album-grid"></div>
  </section>

  <section class="album-view hidden" id="album-detail">
    <a class="album-back" href="photos.html">← 全部相册</a>
    <div class="album-head" id="album-head"></div>
    <div class="photo-grid" id="photo-grid"></div>
  </section>

</main>

<footer class="site-foot">
  <div class="wrap">
    <span>© <span class="js-year">2026</span> 小窝 · 手写 HTML 和 CSS · <a href="admin.html">后台</a></span>
    <span class="grow">此刻 <span id="now">--:--</span>，欢迎来坐坐</span>
  </div>
</footer>

<script src="assets/site-data.js"></script>
<script src="assets/posts.js"></script>
<script src="assets/photos.js"></script>
<script src="assets/site.js"></script>
<script src="assets/kit.js"></script>
<script src="assets/gallery.js"></script>
</body>
</html>
